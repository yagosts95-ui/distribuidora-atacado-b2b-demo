<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="MH Digital — canal de pedidos e gestão da MH Distribuidora." />
    <link rel="icon" href="/assets/mh-app-icon.svg" type="image/svg+xml" />
    <script>
      (() => {
        const path = window.location.pathname;
        const admin = path === "/admin" || path.startsWith("/admin/") || path === "/gestor" || path.startsWith("/gestor/");
        const canonical = admin ? "/gestor/" : "/cliente/";

        if (path === "/" || path === "/admin" || path === "/gestor" || path === "/cliente") {
          window.history.replaceState({}, "", canonical);
        }

        const manifest = document.createElement("link");
        manifest.rel = "manifest";
        manifest.href = admin ? "/manifest-admin.webmanifest" : "/manifest-client.webmanifest";
        document.head.appendChild(manifest);

        document.title = admin ? "MH Gestor" : "MH Digital";
      })();
    </script>
    <title>MH Digital</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
